name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips `postinstall: electron-builder install-app-deps`,
      # which would otherwise download and rebuild Electron for no reason — these
      # tests are plain `node --test` and never launch Electron.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Syntax check
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Include *.js |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
